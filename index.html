<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELEKSI KADES | CIPANCAR</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1fnxW47f6qg-4umWjWRwWjeAXYsMOuATO" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f1f5f9;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s ease-out, visibility 0.6s;
        }
        .logo-container {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            animation: float 3s ease-in-out infinite;
        }
        .logo-container img { width: 60px; height: auto; }
        .loading-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .loading-subtitle { font-size: 14px; color: #64748b; margin-bottom: 24px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float { 50% { transform: translateY(-10px); } }
        
        #appFrame {
            width: 100%; height: 100%; border: none;
            opacity: 0; transition: opacity 0.8s ease-in; background-color: transparent;
        }
        .fade-out { opacity: 0; visibility: hidden; }
        .fade-in { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="logo-container">
            <img src="https://lh3.googleusercontent.com/d/1fnxW47f6qg-4umWjWRwWjeAXYsMOuATO" alt="Logo Desa">
        </div>
        <div class="loading-title">Aplikasi Seleksi Kades</div>
        <div class="loading-subtitle">Menyiapkan sistem untuk Anda...</div>
        <div class="spinner"></div>
    </div>
    <iframe id="appFrame" src="" allow="geolocation; camera; clipboard-read; clipboard-write" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'index';
        
        // PENTING: Jangan ubah URL ini lagi. Ini adalah URL BARU dari Screenshot Anda.
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyZZTLCprHA6T8kxG2j7H-i3C5T5Vq0fwSOv0Ghm7to6P0VmpT0yrW3dUgC-HhGm7k/exec";
        
        const iframe = document.getElementById('appFrame');
        const loadingScreen = document.getElementById('loading-screen');

        iframe.onload = function() {
            setTimeout(() => {
                loadingScreen.classList.add('fade-out');
                iframe.classList.add('fade-in');
            }, 600);
        };
        iframe.src = webAppUrl + "?page=" + page;
    </script>
</body>
</html>
